name: Small-fix rendered evidence
on:
  push:
    branches: [work/render-small-fixes-20261105]
permissions:
  contents: write
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_SHA: 1fdad99e6494897d719981e4f0326538053b1f36
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Rebuild the complete baseline corpus
        run: |
          git fetch origin "$BASE_SHA" --depth=1
          git worktree add --detach "$RUNNER_TEMP/visual" "$BASE_SHA"
          cd "$RUNNER_TEMP/visual"
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[dev]' playwright
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/benchmark-radar normalize-catalog
          .venv/bin/benchmark-radar classify
          if ! command -v google-chrome && ! command -v chromium && ! command -v chromium-browser; then
            .venv/bin/python -m playwright install --with-deps chromium
          fi
      - name: Capture before and after and audit real records
        run: python .verification/visual.py
      - name: Publish evidence only on its own branch
        run: |
          git add -f .verification/out/visual
          git -c user.name='Shi Li' -c user.email='118102425+Li018@users.noreply.github.com' commit -m 'docs: retain rendered before-after evidence for three small fixes'
          git push origin HEAD:refs/heads/work/small-fixes-evidence-20261105
      - name: Keep rendered evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: small-fixes-rendered-evidence
          path: .verification/out/visual/
          retention-days: 14
