name: Small fixes source context

on:
  push:
    branches: [work/verify-small-fixes-20261105]

permissions:
  contents: read

jobs:
  source-context:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Archive reviewed source and tests
        run: |
          git archive --format=tar.gz -o source-context.tar.gz HEAD src tests site/assets pyproject.toml principle.md AGENTS.md CONTRIBUTING.md docs .github data/snapshots .gitmodules
          python - <<'PY'
          from pathlib import Path
          source = Path('site/assets/app.js').read_text()
          for name in ('librarySavedSlugs', 'setLibrarySaved'):
              start = source.index('function ' + name + '(')
              print(source[start:source.index('\n}\n', start) + 2])
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: source-context
          path: source-context.tar.gz
          retention-days: 7
